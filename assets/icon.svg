<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Градиент фона -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#1A252F"/>
    </linearGradient>

    <!-- Градиент шерсти -->
    <linearGradient id="foxFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Белая шерсть -->
    <linearGradient id="whiteFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>

    <!-- Градиент оправы -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>

    <!-- Тень -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Фон (скругленный квадрат) -->
  <rect x="32" y="32" width="448" height="448" rx="105" fill="url(#bgGrad)"/>

  <!-- Персонаж -->
  <g filter="url(#dropShadow)">
    
    <!-- Левое ухо (внешнее) -->
    <path d="M 160 210 Q 120 90 125 80 Q 185 100 215 160 Z" fill="url(#foxFur)"/>
    <!-- Левое ухо (внутреннее) -->
    <path d="M 160 190 Q 135 110 138 100 Q 180 115 200 160 Z" fill="#FFE0B2"/>

    <!-- Правое ухо (внешнее) -->
    <path d="M 352 210 Q 392 90 387 80 Q 327 100 297 160 Z" fill="url(#foxFur)"/>
    <!-- Правое ухо (внутреннее) -->
    <path d="M 352 190 Q 377 110 374 100 Q 332 115 312 160 Z" fill="#FFE0B2"/>

    <!-- Голова -->
    <path d="M 140 270 C 130 180 382 180 372 270 C 372 350 330 390 256 390 C 182 390 140 350 140 270 Z" fill="url(#foxFur)"/>

    <!-- Щечки и мордочка (белый мех) -->
    <path d="M 140 270 Q 200 300 210 380 Q 160 370 140 330 Z" fill="url(#whiteFur)"/>
    <path d="M 372 270 Q 312 300 302 380 Q 352 370 372 330 Z" fill="url(#whiteFur)"/>
    <path d="M 195 320 C 195 270 317 270 317 320 C 317 385 195 385 195 320 Z" fill="url(#whiteFur)"/>

    <!-- Глаза -->
    <g fill="#2C3E50">
      <ellipse cx="205" cy="265" rx="14" ry="18"/>
      <ellipse cx="307" cy="265" rx="14" ry="18"/>
    </g>
    <!-- Блики в глазах -->
    <g fill="#FFFFFF">
      <circle cx="201" cy="258" r="5"/>
      <circle cx="209" cy="270" r="2.5"/>
      <circle cx="303" cy="258" r="5"/>
      <circle cx="311" cy="270" r="2.5"/>
    </g>

    <!-- Носик -->
    <path d="M 242 300 C 242 292 270 292 270 300 C 270 312 256 318 256 318 C 256 318 242 312 242 300 Z" fill="#2C2C2C"/>
    <ellipse cx="252" cy="297" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.6"/>

    <!-- Улыбка -->
    <path d="M 246 324 Q 256 330 266 324" fill="none" stroke="#2C2C2C" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Очки -->
    <g stroke="url(#frameGrad)" stroke-width="9" fill="none" filter="url(#softShadow)">
      <circle cx="205" cy="268" r="42" fill="rgba(255,255,255,0.12)"/>
      <circle cx="307" cy="268" r="42" fill="rgba(255,255,255,0.12)"/>
      <path d="M 247 265 Q 256 260 265 265"/>
      <path d="M 163 268 L 142 260"/>
      <path d="M 349 268 L 370 260"/>
    </g>
    <!-- Блик на очках -->
    <path d="M 180 240 L 210 240 L 195 285 Z" fill="#FFFFFF" opacity="0.15"/>
    <path d="M 282 240 L 312 240 L 297 285 Z" fill="#FFFFFF" opacity="0.15"/>

    <!-- Бабочка -->
    <path d="M 230 400 L 256 412 L 282 400 L 282 424 L 256 412 L 230 424 Z" fill="#27AE60"/>
    <circle cx="256" cy="412" r="6" fill="#1E8449"/>

  </g>
</svg>
